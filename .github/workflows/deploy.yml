name: CI/CD Pipeline

on:
  push:
    branches: [dev]
  # staging/prod jobs get added here once those environments actually exist
  # (ACM cert requested, samconfig.toml sections added) — this mirrors
  # fintech's structure, just scoped to what's real today.

permissions:
  id-token: write   # required for OIDC — lets this workflow request an AWS credential
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version string
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="1.0.${{ github.run_number }}+${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aws-sam-cli
      - run: cp -r src ./package/
      - run: sam build --template infrastructure/template.yaml --no-cached
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331191957820:role/debos-boxing-github-actions-role
          aws-region: us-east-1
      - run: sam package --s3-bucket debos-boxing-artifacts-dev-331191957820 --output-template-file packaged-template.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-template
          path: packaged-template.yaml

  # ============================================================
  # PLAN — creates a real CloudFormation changeset and prints
  # exactly what it would do, so the actual diff is visible in
  # the logs before anything touches real infrastructure.
  #
  # This checks the changeset's StatusReason directly via the
  # CloudFormation API, rather than relying on sam deploy's own
  # wrapper output — more durable, since it doesn't depend on
  # SAM CLI's error-message wording (which can change between
  # versions) for something this important to get right.
  # ============================================================
  plan-dev:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      changeset_type: ${{ steps.changeset-type.outputs.type }}
      has_changes: ${{ steps.create-changeset.outputs.has_changes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaged-template
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331191957820:role/debos-boxing-github-actions-role
          aws-region: us-east-1
      - name: Determine changeset type (handles deleted/stub stacks correctly)
        id: changeset-type
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name debos-boxing-booking-platform-dev --region us-east-1 --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STACK_STATUS" == "NOT_FOUND" ] || [ "$STACK_STATUS" == "DELETE_COMPLETE" ] || [ "$STACK_STATUS" == "REVIEW_IN_PROGRESS" ] || [ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]; then
            echo "type=CREATE" >> "$GITHUB_OUTPUT"
          else
            echo "type=UPDATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Create changeset (does NOT execute anything yet)
        id: create-changeset
        run: |
          aws cloudformation create-change-set \
            --stack-name debos-boxing-booking-platform-dev \
            --change-set-name gha-${{ github.run_id }} \
            --change-set-type ${{ steps.changeset-type.outputs.type }} \
            --template-body file://packaged-template.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=Environment,ParameterValue=dev \
              ParameterKey=EnableCloudFront,ParameterValue=false \
              ParameterKey=AdminEmail,ParameterValue=${{ secrets.ADMIN_EMAIL }} \
              ParameterKey=FrontendBaseUrl,ParameterValue=https://debosboxingandfitness.com \
            --region us-east-1
          # So we poll manually and inspect the REASON before deciding.
          aws cloudformation wait change-set-create-complete \
            --stack-name debos-boxing-booking-platform-dev \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 || true

          STATUS=$(aws cloudformation describe-change-set --stack-name debos-boxing-booking-platform-dev --change-set-name gha-${{ github.run_id }} --region us-east-1 --query "Status" --output text)
          REASON=$(aws cloudformation describe-change-set --stack-name debos-boxing-booking-platform-dev --change-set-name gha-${{ github.run_id }} --region us-east-1 --query "StatusReason" --output text)

          if [ "$STATUS" == "FAILED" ]; then
            if [[ "$REASON" == *"didn't contain changes"* ]] || [[ "$REASON" == *"No updates are to be performed"* ]]; then
              echo "No changes detected — dev already matches this template. Nothing to deploy."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              aws cloudformation delete-change-set --stack-name debos-boxing-booking-platform-dev --change-set-name gha-${{ github.run_id }} --region us-east-1
            else
              echo "Changeset genuinely failed: $REASON"
              exit 1
            fi
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Print the actual plan — this is the real diff about to be applied
        if: steps.create-changeset.outputs.has_changes == 'true'
        run: |
          aws cloudformation describe-change-set \
            --stack-name debos-boxing-booking-platform-dev \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 \
            --query "Changes[].{Action:ResourceChange.Action,Resource:ResourceChange.LogicalResourceId,Type:ResourceChange.ResourceType,Replacement:ResourceChange.Replacement}" \
            --output table
      - name: Clean up failed changeset (only runs if a step above failed)
        if: failure()
        run: |
          aws cloudformation delete-change-set \
            --stack-name debos-boxing-booking-platform-dev \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 || true

  # ============================================================
  # APPLY — dev deploys automatically once the plan runs clean,
  # NO approval gate. That's deliberate: dev is meant to be a
  # fast iteration loop. staging/prod (once built) will use
  # GitHub Environment approval gates the same way fintech's do —
  # dev specifically should NOT, or every push here would need a
  # manual click, defeating the point of a fast dev loop.
  # ============================================================
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [plan-dev, build]
    if: success()
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::331191957820:role/debos-boxing-github-actions-role
          aws-region: us-east-1
      - name: Execute changeset (only if there are real changes to apply)
        if: needs.plan-dev.outputs.has_changes == 'true'
        run: |
          EXEC_STATUS=$(aws cloudformation describe-change-set \
            --stack-name debos-boxing-booking-platform-dev \
            --change-set-name gha-${{ github.run_id }} \
            --region us-east-1 \
            --query "ExecutionStatus" --output text)

          if [ "$EXEC_STATUS" == "EXECUTE_COMPLETE" ]; then
            echo "This changeset already executed successfully — likely a duplicate job dispatch. Dev is already up to date, nothing more to do."
          else
            aws cloudformation execute-change-set \
              --stack-name debos-boxing-booking-platform-dev \
              --change-set-name gha-${{ github.run_id }} \
              --region us-east-1

            if [ "${{ needs.plan-dev.outputs.changeset_type }}" == "CREATE" ]; then
              aws cloudformation wait stack-create-complete --stack-name debos-boxing-booking-platform-dev --region us-east-1
            else
              aws cloudformation wait stack-update-complete --stack-name debos-boxing-booking-platform-dev --region us-east-1
            fi
          fi
      - name: No changes to deploy
        if: needs.plan-dev.outputs.has_changes != 'true'
        run: echo "Dev already matches this template — nothing to deploy this run."
      - name: Publish version to SSM Parameter Store
        run: |
          aws ssm put-parameter \
            --name "/debos-boxing/dev/app-version" \
            --value "${{ needs.build.outputs.app_version }}" \
            --type String \
            --overwrite \
            --region us-east-1
      - name: Print live stack URL
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name debos-boxing-booking-platform-dev --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "Dev API is live at: $URL/health"
          echo "Docs: $URL/docs"
